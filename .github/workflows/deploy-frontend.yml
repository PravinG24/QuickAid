name: Deploy Frontend to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [ main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          AZURE_FUNCTION_API_BASE: ${{ secrets.AZURE_FUNCTION_API_BASE }}
          APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || (echo "Missing AZURE_WEBAPP_NAME secret" && exit 1)
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || (echo "Missing AZURE_WEBAPP_PUBLISH_PROFILE secret" && exit 1)
          test -n "$AZURE_FUNCTION_API_BASE" || (echo "Missing AZURE_FUNCTION_API_BASE secret" && exit 1)
          test -n "$APPINSIGHTS_CONNECTION_STRING" || (echo "Missing APPINSIGHTS_CONNECTION_STRING secret" && exit 1)

      - name: Configure API base and MSAL
        env:
          AZURE_FUNCTION_API_BASE: ${{ secrets.AZURE_FUNCTION_API_BASE }}
          APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          cat > frontend/config.js <<'EOF'
          // API Configuration
          window.QUICKAID_API_BASE = "__AZURE_FUNCTION_API_BASE__";

          // Application Insights Configuration
          window.QUICKAID_APPINSIGHTS_STRING = "__APPINSIGHTS_CONNECTION_STRING__";
          
          // Microsoft Entra ID (MSAL.js) Configuration
          window.QUICKAID_ENTRA_TENANT_ID = "4f8311db-1cf6-4e90-850e-85c68f716efd";
          window.QUICKAID_ENTRA_CLIENT_ID = "b19ae468-e969-4c94-830d-c848533f3979";
          window.QUICKAID_ENTRA_API_AUDIENCE = "api://2992ace2-9cb6-49b7-a365-904871ea0f4b";
          window.QUICKAID_ENTRA_API_SCOPE = window.QUICKAID_ENTRA_API_AUDIENCE + "/access_as_user";
          window.QUICKAID_ENTRA_REDIRECT_URI = window.location.origin + "/login.html";
          EOF
          sed -i "s|__AZURE_FUNCTION_API_BASE__|$AZURE_FUNCTION_API_BASE|g" frontend/config.js
          sed -i "s|__APPINSIGHTS_CONNECTION_STRING__|$APPINSIGHTS_CONNECTION_STRING|g" frontend/config.js

      - name: Package frontend
        run: |
          cd frontend
          zip -r ../frontend.zip .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./frontend.zip

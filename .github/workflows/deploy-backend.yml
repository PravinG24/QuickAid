name: Deploy Backend to Azure Functions

on:
  push:
    branches: [ main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'


jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip backend package
        run: |
          cd backend
          zip -r ../backend.zip .
          
      - name: Extract SCM credentials from publish profile
        id: scm
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          SCM_USER=$(echo "$PUBLISH_PROFILE" | grep -o 'userName="\$[^"]*"' | head -1 | cut -d'"' -f2)
          SCM_PASS=$(echo "$PUBLISH_PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)
          SCM_URL=$(echo "$PUBLISH_PROFILE" | grep -o 'publishUrl="[^"]*scm[^"]*"' | head -1 | cut -d'"' -f2)
          
          echo "scm_user=$SCM_USER" >> $GITHUB_OUTPUT
          echo "scm_pass=$SCM_PASS" >> $GITHUB_OUTPUT
          echo "scm_url=$SCM_URL" >> $GITHUB_OUTPUT

      - name: Deploy via zipdeploy
        env:
          SCM_USER: ${{ steps.scm.outputs.scm_user }}
          SCM_PASS: ${{ steps.scm.outputs.scm_pass }}
          SCM_URL: ${{ steps.scm.outputs.scm_url }}
        run: |
          SCM_HOST=$(echo "$SCM_URL" | sed 's/:443//')

          echo "Deploying via /api/publish..."
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            --user "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/zip" \
            --data-binary @backend.zip \
            "https://${SCM_HOST}/api/publish?RemoteBuild=true&Async=false")
          
          echo "Status: $STATUS"
          cat /tmp/response.txt

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Deploy succeeded!"
            exit 0
          else
            echo "❌ Deploy failed with status $STATUS"
            exit 1
          fi
name: Deploy Backend to Azure Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'


jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip backend package
        run: |
          cd backend
          zip -r ../backend.zip .
          
      - name: Extract SCM credentials from publish profile
        id: scm
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          SCM_USER=$(echo "$PUBLISH_PROFILE" | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          SCM_PASS=$(echo "$PUBLISH_PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)
          SCM_URL=$(echo "$PUBLISH_PROFILE" | grep -o 'publishUrl="[^"]*scm[^"]*"' | head -1 | cut -d'"' -f2)
          echo "scm_user=$SCM_USER" >> $GITHUB_OUTPUT
          echo "scm_pass=$SCM_PASS" >> $GITHUB_OUTPUT
          echo "scm_url=$SCM_URL" >> $GITHUB_OUTPUT

      - name: Debug publish profile parsing
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          echo "--- RAW GREP OUTPUT ---"
          echo "$PUBLISH_PROFILE" | grep -o 'userName="[^"]*"'
          echo "$PUBLISH_PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | cut -c1-30  # partial only, safe
          echo "$PUBLISH_PROFILE" | grep -o 'publishUrl="[^"]*scm[^"]*"'
          echo "--- END ---"

      - name: Deploy via zipdeploy
        run: |
          curl -X POST \
            --fail \
            --user "${{ steps.scm.outputs.scm_user }}:${{ steps.scm.outputs.scm_pass }}" \
            --data-binary @backend.zip \
            "https://${{ steps.scm.outputs.scm_url }}/api/zipdeploy?isAsync=false"

  
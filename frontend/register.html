<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickAid - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./auth.css" />
  </head>
  <body class="auth-page register-page">
    <a class="skip-link" href="#authMain">Skip to registration</a>
    <main class="entra-layout" id="authMain">
      <section class="entra-panel">
        <a class="auth-brand-link" href="./index.html">QuickAid Service Desk</a>
        <h1>Create account</h1>
        <p class="entra-subtitle">Create access for ticket tracking, support work, or administration.</p>
        <form id="registerPageForm" novalidate>
          <label class="input-shell">
            <span>Full name</span>
            <input id="registerName" name="name" type="text" placeholder="Example: Nur Aisyah Rahman..." required autocomplete="name" />
            <small class="error" id="registerNameError"></small>
          </label>
          <label class="input-shell">
            <span>Email</span>
            <input id="registerEmail" name="email" type="email" placeholder="you@campus.edu..." required autocomplete="email" spellcheck="false" />
            <small class="error" id="registerEmailError"></small>
          </label>
          <label class="input-shell">
            <span>Role</span>
            <select id="registerRole" name="role" required>
              <option value="user">Student</option>
              <!-- Extra frontend-only role disabled: backend has no staff account route yet.
              <option value="staff">Staff</option>
              -->
              <option value="admin">Admin</option>
            </select>
            <small class="error" id="registerRoleError"></small>
          </label>
          <div class="input-shell">
            <label for="registerPassword">Password</label>
            <div class="password-field">
              <input id="registerPassword" name="password" type="password" placeholder="Create password..." required autocomplete="new-password" />
              <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle="registerPassword">
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 3 18 18"></path>
                  <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-1.2"></path>
                  <path d="M7.3 7.7C4.3 9.3 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.2"></path>
                  <path d="M13.9 6.2C18.7 7 21.5 12 21.5 12a16.5 16.5 0 0 1-2.1 2.7"></path>
                </svg>
              </button>
            </div>
            <small class="error" id="registerPasswordError"></small>
          </div>
          <p class="entra-subtitle hidden" id="registerApprovalNote" aria-live="polite"></p>

          <button type="submit" class="signin-btn">Register</button>

          <!-- Extra frontend-only function disabled: Microsoft Entra auth has no backend route yet.
          <div class="or-divider"><span>Or</span></div>
          <button type="button" id="registerMicrosoftBtn" class="entra-btn">
            <img class="entra-logo" src="./assets/Microsoft_Entra_ID_color_icon.png" width="18" height="18" alt="" aria-hidden="true" />
            <span>Sign In with Microsoft Entra ID</span>
          </button>
          -->
        </form>
        <div class="auth-links">
          <a href="./login.html">Go to login</a>
          <a href="./index.html">Back to home</a>
        </div>
      </section>
   <section class="entra-hero" aria-hidden="true">
        <div class="hero-orb"></div>
        <div class="hero-orb hero-orb-2"></div>
        <div class="hero-orb hero-orb-3"></div>
        <div class="hero-bear-card">
          <div class="bear" id="registerBear">
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="face">
              <div class="eye left">
                <span class="pupil" id="registerLeftEye"></span>
                <span class="lid"></span>
              </div>
              <div class="eye right">
                <span class="pupil" id="registerRightEye"></span>
                <span class="lid"></span>
              </div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth-area">
                <div class="nose"></div>
                <div class="mouth"></div>
              </div>
            </div>
            <div class="hand left"></div>
            <div class="hand right"></div>
          </div>
          <h2>Campus support, in one place</h2>
          <p>Submit requests, track updates, and coordinate helpdesk work securely.</p>
        </div>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./auth.js" defer></script>
  </body>
</html>
